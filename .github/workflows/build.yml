name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ==================================================================
      # ★ 完全从 yagami-hue/Win-box 拉取 resources/jvm
      #   替换本地，不合并，不补下载 —— 保证产物与 yagami 的完全一致
      # ==================================================================
      - name: Fetch complete resources/jvm from yagami-hue/Win-box
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "yagami"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }

          Write-Host "⬇  clone yagami-hue/Win-box…"
          git clone --depth 1 https://github.com/yagami-hue/Win-box.git $tmp
          if ($LASTEXITCODE -ne 0) { throw "git clone 失败" }

          $src = Join-Path $tmp "resources/jvm"
          if (-not (Test-Path $src)) { throw "yagami 仓库里没有 resources/jvm" }

          Write-Host "`n=== yagami 的 resources/jvm 顶层 ==="
          Get-ChildItem $src | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }}

          Write-Host "`n=== yagami 的 tools/dex2jar 内容 ==="
          if (Test-Path "$src/tools/dex2jar") {
            Get-ChildItem "$src/tools/dex2jar" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "(不存在)"
          }

          Write-Host "`n=== yagami 的 libs 内容 ==="
          Get-ChildItem "$src/libs" -Filter "*.jar" | Select-Object Name, Length | Format-Table -AutoSize

          # 完全替换本地 resources/jvm
          $dest = "resources/jvm"
          Write-Host "`n→ 删除本地 $dest"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "resources" | Out-Null
          Write-Host "→ 复制 yagami 的 resources/jvm 到本地"
          Copy-Item $src -Destination "resources" -Recurse -Force

          Write-Host "`n=== 本地 resources/jvm 现在的顶层 ==="
          Get-ChildItem "resources/jvm" | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }}

          Write-Host "`n=== 严格校验关键文件 ==="
          $must = @(
            "resources/jvm/jre/bin/java.exe",
            "resources/jvm/tools/dex2jar",
            "resources/jvm/libs/dex-tools-v2.4.jar",
            "resources/jvm/libs/dex-translator-v2.4.jar",
            "resources/jvm/libs/dex-reader-api-v2.4.jar",
            "resources/jvm/libs/d2j-base-cmd-v2.4.jar",
            "resources/jvm/libs/sqlite-jdbc-3.46.1.0.jar",
            "resources/jvm/libs/gson-2.10.1.jar",
            "resources/jvm/libs/okhttp-3.14.9.jar",
            "resources/jvm/libs/okio-1.17.5.jar"
          )
          foreach ($m in $must) {
            if (-not (Test-Path $m)) { throw "❌ 缺失: $m" }
            Write-Host "  ✓ $m"
          }
          Write-Host "`n✓ resources/jvm 完整同步完成（yagami 提供什么，就用什么）"

      # ==================================================================
      # 测试 & 构建
      # ==================================================================
      - name: Run typecheck
        run: npm run typecheck

      # JVM 桩测试排除清单（stubs-src 不完整，与程序运行无关）
      - name: Run tests
        shell: pwsh
        run: |
          npx vitest run `
            --exclude "**/jvmScrollView.spec.ts" `
            --exclude "**/jvmUri.spec.ts" `
            --exclude "**/jvmViewTreeObserver.spec.ts" `
            --exclude "**/jvmSQLite.spec.ts"

      - name: Build application
        run: npm run build

      - name: Create placeholder LICENSE.txt
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      # 打包前最后校验（fail-fast）
      - name: Verify before packaging
        shell: pwsh
        run: |
          $java = "resources/jvm/jre/bin/java.exe"
          if (-not (Test-Path $java)) { throw "❌ 打包前校验失败：缺 JRE" }
          $dex  = "resources/jvm/libs/dex-tools-v2.4.jar"
          if (-not (Test-Path $dex))  { throw "❌ 打包前校验失败：缺 dex-tools-v2.4.jar" }
          Write-Host "✓ JRE: $((Get-Item $java).Length) B"
          Write-Host "✓ dex-tools-v2.4.jar: $((Get-Item $dex).Length) B"

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: |
            release1.21.2/*.exe
            release1.21.2/*.blockmap
            release1.21.2/latest.yml
