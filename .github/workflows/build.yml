name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ★ 2026-10-14（新增）：CI 里需要 JDK 才能编译 JVM stubs（供测试用）
      - name: Setup Java (for JVM stubs)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ★ 2026-10-14（新增）：把 resources/jvm/stubs-src/**.java 编译成 resources/jvm/stubs/stubs.jar
      #   失败根因：stubs.jar 是构建产物、不在 git 里；CI 干净 checkout 没有 → 测试编译 android.* 找不到符号。
      - name: Compile JVM stubs
        shell: pwsh
        run: |
          $src = "resources/jvm/stubs-src"
          $outDir = "resources/jvm/stubs"
          if (-not (Test-Path $src)) { throw "stubs-src 目录不存在：$src" }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $classes = Join-Path $outDir "classes"
          Remove-Item -Recurse -Force $classes -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $classes | Out-Null

          $files = Get-ChildItem -Path $src -Recurse -Filter "*.java" | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { throw "stubs-src 下没有 .java 文件" }
          Write-Host "🔨 编译 $($files.Count) 个 .java 文件…"
          javac -encoding UTF-8 -d $classes $files
          if ($LASTEXITCODE -ne 0) { throw "javac 编译失败" }

          $jar = Join-Path $outDir "stubs.jar"
          Remove-Item -Force $jar -ErrorAction SilentlyContinue
          jar cf $jar -C $classes .
          if (-not (Test-Path $jar)) { throw "stubs.jar 未生成" }
          Write-Host "✓ stubs.jar 生成：$jar（$((Get-Item $jar).Length) B）"

      - name: Run typecheck
        run: npm run typecheck

      # ★ 2026-10-14（新增）：准备 JRE（Windows x64）—— 供 jar 源运行（jar-spider）
      - name: Prepare JRE (Windows x64)
        shell: pwsh
        run: |
          $jreDir = "resources/jvm/jre"
          if (Test-Path "$jreDir/bin/java.exe") {
            Write-Host "✓ JRE 已存在，跳过下载：$jreDir"
            & "$jreDir/bin/java.exe" -version
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $jreDir | Out-Null
          $url = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          $zip = Join-Path $env:RUNNER_TEMP "jre.zip"
          $extract = Join-Path $env:RUNNER_TEMP "jre-extract"
          Write-Host "⬇  下载 JRE：$url"
          $attempts = 0; $maxAttempts = 3
          while ($attempts -lt $maxAttempts) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600; break }
            catch {
              Write-Warning "下载失败（第 $attempts 次）：$($_.Exception.Message)"
              if ($attempts -ge $maxAttempts) { throw "JRE 下载失败" }
              Start-Sleep -Seconds 5
            }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (-not $inner) { throw "解压后未找到目录" }
          Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $jreDir -Force
          if (-not (Test-Path "$jreDir/bin/java.exe")) { throw "JRE 准备失败" }
          & "$jreDir/bin/java.exe" -version
          Write-Host "✓ JRE 就绪：$jreDir"

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Create placeholder LICENSE.txt
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      # ★ 打包前校验：JRE + stubs.jar 都要在
      - name: Verify JRE and stubs before packaging
        shell: pwsh
        run: |
          $java = "resources/jvm/jre/bin/java.exe"
          $stubs = "resources/jvm/stubs/stubs.jar"
          if (-not (Test-Path $java)) { throw "打包前校验失败：$java 不存在" }
          if (-not (Test-Path $stubs)) { throw "打包前校验失败：$stubs 不存在" }
          Write-Host "✓ java.exe: $((Get-Item $java).Length) B"
          Write-Host "✓ stubs.jar: $((Get-Item $stubs).Length) B"

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: |
            release1.21.01/*.exe
            release1.21.01/*.blockmap
            release1.21.01/latest.yml
