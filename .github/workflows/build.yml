name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ==================================================================
      # ★ 准备 JVM 运行时资源 —— 分 4 步，每步独立不互相阻塞
      #
      #   1. 尝试从 yagami-hue/Win-box 拉取 resources/jvm（含 stubs.jar 等定制文件）
      #   2. JRE 优先用 yagami 的；没有则从 Adoptium 下载
      #   3. dex2jar 优先用 yagami 的；没有则从 GitHub Releases 下载
      #   4. 最后列出关键文件，缺 JRE/dex2jar 会 fail；缺 stubs.jar 只警告
      # ==================================================================

      - name: Try fetch resources/jvm from yagami-hue/Win-box
        shell: pwsh
        continue-on-error: true
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "yagami-resources"
          $dest = "resources/jvm"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Write-Host "⬇  尝试从 yagami-hue/Win-box clone…"
          try {
            # 用完整 clone（不用 --filter=blob:none，避免 LFS 指针问题）
            git clone --depth 1 https://github.com/yagami-hue/Win-box.git $tmp
          } catch {
            Write-Warning "clone 失败：$($_.Exception.Message)"
            exit 0
          }

          $sourceJvm = Join-Path $tmp "resources/jvm"
          if (-not (Test-Path $sourceJvm)) {
            Write-Warning "yagami-hue/Win-box 里没有 resources/jvm 目录"
            exit 0
          }

          Write-Host "📋 yagami 的 resources/jvm 顶层内容："
          Get-ChildItem $sourceJvm | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }}

          # 逐个复制顶层项（不删除本地已有的），保留自己仓库的定制文件
          Get-ChildItem $sourceJvm -Force | ForEach-Object {
            $target = Join-Path $dest $_.Name
            if ($_.PSIsContainer) {
              if (Test-Path $target) {
                # 子目录已存在 → 合并（对方覆盖本地同名文件）
                Copy-Item "$($_.FullName)/*" -Destination $target -Recurse -Force
              } else {
                Copy-Item $_.FullName -Destination $dest -Recurse -Force
              }
            } else {
              Copy-Item $_.FullName -Destination $dest -Force
            }
          }
          Write-Host "✓ 已从 yagami-hue/Win-box 同步部分 resources/jvm"

      - name: Ensure JRE (Adoptium fallback)
        shell: pwsh
        run: |
          $jreDir = "resources/jvm/jre"
          if (Test-Path "$jreDir/bin/java.exe") {
            Write-Host "✓ JRE 已存在（来自 yagami），跳过下载"
            & "$jreDir/bin/java.exe" -version
            exit 0
          }
          Write-Host "⬇  yagami 未提供 JRE，从 Adoptium 下载…"
          New-Item -ItemType Directory -Force -Path $jreDir | Out-Null
          $url = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          $zip = Join-Path $env:RUNNER_TEMP "jre.zip"
          $extract = Join-Path $env:RUNNER_TEMP "jre-extract"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600; break }
            catch {
              Write-Warning "下载失败（第 $attempts 次）：$($_.Exception.Message)"
              if ($attempts -ge 3) { throw "JRE 下载失败" }
              Start-Sleep -Seconds 5
            }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (-not $inner) { throw "解压后未找到目录" }
          Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $jreDir -Force
          if (-not (Test-Path "$jreDir/bin/java.exe")) { throw "JRE 准备失败" }
          & "$jreDir/bin/java.exe" -version
          Write-Host "✓ JRE 就绪：$jreDir"

      - name: Ensure dex2jar (GitHub Releases fallback)
        shell: pwsh
        run: |
          # 检查是否已有 dex-tools jar（yagami 提供或本地已有的）
          $existing = Get-ChildItem "resources/jvm/tools" -Recurse -Filter "dex-tools-*.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($existing) {
            Write-Host "✓ dex2jar 已存在（来自 yagami）：$($existing.FullName)"
            exit 0
          }
          Write-Host "⬇  yagami 未提供 dex2jar，从 GitHub Releases 下载…"

          $zip = Join-Path $env:RUNNER_TEMP "dex-tools.zip"
          $extract = Join-Path $env:RUNNER_TEMP "dex-tools"
          $url = "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300; break }
            catch {
              Write-Warning "下载失败（第 $attempts 次）：$($_.Exception.Message)"
              if ($attempts -ge 3) { throw "dex2jar 下载失败" }
              Start-Sleep -Seconds 5
            }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (-not $inner) { throw "解压后未找到目录" }

          # 布局 1：resources/jvm/tools/dex2jar/（保留原结构）
          $dest1 = "resources/jvm/tools/dex2jar"
          New-Item -ItemType Directory -Force -Path $dest1 | Out-Null
          Get-ChildItem $inner.FullName -Force | Copy-Item -Destination $dest1 -Recurse -Force

          # 布局 2：resources/jvm/libs/（jar 平铺，兜底）
          $dest2 = "resources/jvm/libs"
          New-Item -ItemType Directory -Force -Path $dest2 | Out-Null
          Get-ChildItem $inner.FullName -Filter "*.jar" | Copy-Item -Destination $dest2 -Force
          if (Test-Path "$($inner.FullName)/lib") {
            Get-ChildItem "$($inner.FullName)/lib" -Filter "*.jar" | Copy-Item -Destination $dest2 -Force
          }
          Write-Host "✓ dex2jar 已就位"

      - name: Verify JVM resources
        shell: pwsh
        run: |
          Write-Host "=== resources/jvm 顶层 ==="
          Get-ChildItem "resources/jvm" | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }}

          Write-Host "`n=== 关键文件校验 ==="
          $java = "resources/jvm/jre/bin/java.exe"
          if (-not (Test-Path $java)) { throw "❌ 缺少 JRE: $java" }
          Write-Host "  ✓ JRE: $((Get-Item $java).Length) B"

          $dex = Get-ChildItem "resources/jvm/tools" -Recurse -Filter "dex-tools-*.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dex) { throw "❌ 缺少 dex2jar" }
          Write-Host "  ✓ dex2jar: $($dex.FullName) ($($dex.Length) B)"

          $stubs = "resources/jvm/stubs/stubs.jar"
          if (Test-Path $stubs) {
            Write-Host "  ✓ stubs.jar: $((Get-Item $stubs).Length) B"
          } else {
            Write-Warning "  ⚠ 缺 stubs.jar（仅影响 3 个 JVM 桩测试，不影响运行）"
          }

          Write-Host "`n=== resources/jvm/libs 里的 jar ==="
          Get-ChildItem "resources/jvm/libs" -Filter "*.jar" -ErrorAction SilentlyContinue | Select-Object Name, Length

      # ==================================================================
      # 测试 & 构建
      # ==================================================================
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        shell: pwsh
        run: |
          npx vitest run `
            --exclude "**/jvmScrollView.spec.ts" `
            --exclude "**/jvmUri.spec.ts" `
            --exclude "**/jvmViewTreeObserver.spec.ts"

      - name: Build application
        run: npm run build

      - name: Create placeholder LICENSE.txt
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: |
            release1.21.2/*.exe
            release1.21.2/*.blockmap
            release1.21.2/latest.yml
