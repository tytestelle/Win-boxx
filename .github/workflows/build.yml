name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Package release (electron-builder)
        run: npm run dist
        env:
          # 从 GitHub Secrets 中读取 WINBOX_SUPPORT_IMAGE
          WINBOX_SUPPORT_IMAGE: ${{ secrets.WINBOX_SUPPORT_IMAGE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: release1.21.01/*.exe
