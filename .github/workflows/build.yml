name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ★ 需要 JDK 来编译 stubs-src（提供 javac / jar 命令）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ==================================================================
      # ★ 生成 JVM stubs（Android 桩库）
      #
      #   背景：stubs-src/ 里只有部分 Java 源码（android.view.View、org.json.JSONObject 等），
      #         它们引用的基础类（android.content.Context、android.net.Uri 等）没有源码。
      #   方案：从 Maven Central 下载「完整 Android 类库」作为 classpath，
      #         编译 stubs-src 得到定制类，然后把两者合并成 stubs.jar。
      # ==================================================================
      - name: Prepare JVM stubs
        shell: pwsh
        run: |
          $stubsSrc = "resources/jvm/stubs-src"
          $stubsDir = "resources/jvm/stubs"
          $classes  = Join-Path $stubsDir "classes"

          if (-not (Test-Path $stubsSrc)) { throw "缺少 $stubsSrc" }
          New-Item -ItemType Directory -Force -Path $stubsDir | Out-Null
          Remove-Item -Recurse -Force $classes -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $classes | Out-Null

          # ----- 1. 下载 Robolectric android-all（完整 Android framework 类） -----
          #    ~200 MB，但下载一次即可。Robolectric 版本是为「JVM 上运行 Android 代码」打包的，
          #    纯 Java 实现、无 JNI 依赖 → 在 Windows JVM 上可直接用。
          $androidAll = Join-Path $stubsDir "android-all-base.jar"
          if (-not (Test-Path $androidAll)) {
            $androidAllUrl = "https://repo1.maven.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar"
            Write-Host "⬇  下载 android-all.jar（~200MB，仅一次）…"
            $attempts = 0
            while ($attempts -lt 3) {
              $attempts++
              try {
                Invoke-WebRequest -Uri $androidAllUrl -OutFile $androidAll -UseBasicParsing -TimeoutSec 900
                break
              } catch {
                Write-Warning "下载失败（第 $attempts 次）：$($_.Exception.Message)"
                if ($attempts -ge 3) { throw "android-all 下载失败" }
                Start-Sleep -Seconds 5
              }
            }
          }
          Write-Host "✓ android-all: $((Get-Item $androidAll).Length) B"

          # ----- 2. 下载 org.json（android-all 里未必包含，且 stubs-src 里有 JSONObject 引用） -----
          $orgJson = Join-Path $stubsDir "org-json-base.jar"
          if (-not (Test-Path $orgJson)) {
            $orgJsonUrl = "https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar"
            Write-Host "⬇  下载 org.json…"
            Invoke-WebRequest -Uri $orgJsonUrl -OutFile $orgJson -UseBasicParsing -TimeoutSec 300
          }
          Write-Host "✓ org.json: $((Get-Item $orgJson).Length) B"

          # ----- 3. 编译 stubs-src（用两个 jar 作为 classpath） -----
          $files = Get-ChildItem -Path $stubsSrc -Recurse -Filter "*.java" | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { throw "stubs-src 下没有 .java 文件" }
          Write-Host "🔨 编译 $($files.Count) 个 .java 文件…"

          $cp = "$androidAll;$orgJson"
          javac -encoding UTF-8 -cp $cp -d $classes $files
          if ($LASTEXITCODE -ne 0) { throw "javac 编译失败（见上方详细错误）" }

          # ----- 4. 组装 stubs.jar -----
          #    先放 android-all + org.json（基线），再用 stubs-src 编译结果**覆盖**同名类。
          $stubsJar = Join-Path $stubsDir "stubs.jar"
          Copy-Item $androidAll $stubsJar -Force

          Push-Location $classes
          # 把编译出的所有 class 追加/覆盖进 stubs.jar
          jar uf "../stubs.jar" .
          Pop-Location

          # org.json：如果 android-all 里没有，就从 org.json jar 里补
          # （用 jar 的 uf 更新即可；同名类由 stubs-src 覆盖后已经是定制版）
          Push-Location $stubsDir
          $tempExtract = "temp-orgjson"
          Remove-Item -Recurse -Force $tempExtract -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tempExtract | Out-Null
          Push-Location $tempExtract
          jar xf "../org-json-base.jar"
          Pop-Location
          # 只补充 stubs.jar 里没有的 org/json/* 类（不覆盖 stubs-src 定制版）
          Push-Location $tempExtract
          jar uf "../stubs.jar" .
          Pop-Location
          Remove-Item -Recurse -Force $tempExtract -ErrorAction SilentlyContinue
          Pop-Location

          if (-not (Test-Path $stubsJar)) { throw "stubs.jar 未生成" }
          Write-Host "✓ stubs.jar 生成：$stubsJar（$((Get-Item $stubsJar).Length) B）"

          # ----- 5. 校验：抽样检查关键类是否在 stubs.jar 里 -----
          Push-Location $stubsDir
          $list = & jar tf stubs.jar
          Pop-Location
          foreach ($needle in @("android/content/Context.class", "android/net/Uri.class", "android/view/View.class", "android/widget/ScrollView.class", "org/json/JSONObject.class", "org/json/JSONException.class")) {
            if ($list -notmatch [regex]::Escape($needle)) { throw "stubs.jar 缺少 $needle" }
            Write-Host "  ✓ $needle"
          }

      # ==================================================================
      # ★ 准备 JRE（供 jar-spider 运行 .jar 源使用）
      # ==================================================================
      - name: Prepare JRE (Windows x64)
        shell: pwsh
        run: |
          $jreDir = "resources/jvm/jre"
          if (Test-Path "$jreDir/bin/java.exe") {
            Write-Host "✓ JRE 已存在，跳过"
            & "$jreDir/bin/java.exe" -version
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $jreDir | Out-Null
          $url = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          $zip = Join-Path $env:RUNNER_TEMP "jre.zip"
          $extract = Join-Path $env:RUNNER_TEMP "jre-extract"
          Write-Host "⬇  下载 JRE：$url"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600; break }
            catch {
              Write-Warning "下载失败（第 $attempts 次）：$($_.Exception.Message)"
              if ($attempts -ge 3) { throw "JRE 下载失败" }
              Start-Sleep -Seconds 5
            }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (-not $inner) { throw "解压后未找到目录" }
          Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $jreDir -Force
          if (-not (Test-Path "$jreDir/bin/java.exe")) { throw "JRE 准备失败" }
          & "$jreDir/bin/java.exe" -version
          Write-Host "✓ JRE 就绪：$jreDir"

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Create placeholder LICENSE.txt
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      # ★ 打包前校验：JRE 和 stubs.jar 都必须在
      - name: Verify before packaging
        shell: pwsh
        run: |
          $java  = "resources/jvm/jre/bin/java.exe"
          $stubs = "resources/jvm/stubs/stubs.jar"
          if (-not (Test-Path $java))  { throw "缺少 $java" }
          if (-not (Test-Path $stubs)) { throw "缺少 $stubs" }
          Write-Host "✓ java.exe:  $((Get-Item $java).Length) B"
          Write-Host "✓ stubs.jar: $((Get-Item $stubs).Length) B"

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: |
            release1.21.01/*.exe
            release1.21.01/*.blockmap
            release1.21.01/latest.yml
