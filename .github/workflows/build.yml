name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ==================================================================
      # 1. JRE —— resources/jvm/jre/bin/java.exe
      # ==================================================================
      - name: Prepare JRE
        shell: pwsh
        run: |
          $jreDir = "resources/jvm/jre"
          if (Test-Path "$jreDir/bin/java.exe") {
            Write-Host "JRE already exists"
            & "$jreDir/bin/java.exe" -version
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $jreDir | Out-Null
          $url = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          $zip = Join-Path $env:RUNNER_TEMP "jre.zip"
          $extract = Join-Path $env:RUNNER_TEMP "jre-extract"
          Write-Host "Downloading JRE: $url"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600; break }
            catch {
              Write-Warning "Download failed (attempt $attempts): $($_.Exception.Message)"
              if ($attempts -ge 3) { throw "JRE download failed" }
              Start-Sleep -Seconds 5
            }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $jreDir -Force
          if (-not (Test-Path "$jreDir/bin/java.exe")) { throw "JRE setup failed" }
          & "$jreDir/bin/java.exe" -version

      # ==================================================================
      # 2. ★★★ dex2jar —— 放进 resources/jvm/d2j/（代码唯一读取位置）★★★
      #   代码：
      #     const d2jCp = this.dirJars(join(this.jvmDir, 'd2j')).join(';');
      #     spawn(java, ['-cp', d2jCp, 'com.googlecode.dex2jar.tools.Dex2jarCmd', ...])
      #   所以 dex-tools-v2.4.jar 与它 lib/ 下所有依赖 jar，都必须落在 jvm/d2j/。
      # ==================================================================
      - name: Prepare dex2jar (into d2j/)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "dex-tools.zip"
          $extract = Join-Path $env:RUNNER_TEMP "dex-tools"
          $url = "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip"
          Write-Host "Downloading dex2jar: $url"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300; break }
            catch {
              Write-Warning "Download failed (attempt $attempts): $($_.Exception.Message)"
              if ($attempts -ge 3) { throw "dex2jar download failed" }
              Start-Sleep -Seconds 5
            }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          if (-not $inner) { throw "dex-tools extract failed" }

          Write-Host "=== dex-tools-v2.4 解压后 ==="
          Get-ChildItem $inner.FullName | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }} | Format-Table -AutoSize

          # ★ 目标目录：resources/jvm/d2j/（代码唯一读取位置）
          $d2j = "resources/jvm/d2j"
          Remove-Item -Recurse -Force $d2j -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $d2j | Out-Null

          # 主 jar（dex-tools-v2.4.jar）—— 放顶层
          Get-ChildItem "$($inner.FullName)/*.jar" | Copy-Item -Destination $d2j -Force

          # lib/ 下所有依赖 jar（antlr、asm、d2j-*、dex-*、ST4、dx 等）—— 放顶层
          # 代码是 dirJars() 读 d2j/ 一层（不递归），所以必须平铺在 d2j/ 根
          if (Test-Path "$($inner.FullName)/lib") {
            Get-ChildItem "$($inner.FullName)/lib/*.jar" | Copy-Item -Destination $d2j -Force
          }

          # 脚本也一并放进去（可选，调试方便）
          Get-ChildItem "$($inner.FullName)/*.bat" -ErrorAction SilentlyContinue | Copy-Item -Destination $d2j -Force
          Get-ChildItem "$($inner.FullName)/*.sh" -ErrorAction SilentlyContinue | Copy-Item -Destination $d2j -Force

          Write-Host "=== resources/jvm/d2j 内容 ==="
          Get-ChildItem $d2j -Filter "*.jar" | Select-Object Name, Length | Format-Table -AutoSize

          if (-not (Test-Path "$d2j/dex-tools-v2.4.jar")) { throw "dex-tools-v2.4.jar 未就位" }

          # 顺手放一份到 libs/（兜底：不保证代码会读，但多一份不亏）
          $libs = "resources/jvm/libs"
          New-Item -ItemType Directory -Force -Path $libs | Out-Null
          Get-ChildItem $d2j -Filter "*.jar" | Copy-Item -Destination $libs -Force

      # ==================================================================
      # 3. Maven 依赖 —— resources/jvm/libs/*.jar（stubs 编译 + 运行时 classpath）
      # ==================================================================
      - name: Prepare Maven deps
        shell: pwsh
        run: |
          $libs = "resources/jvm/libs"
          New-Item -ItemType Directory -Force -Path $libs | Out-Null
          $maven = @(
            @{ n = "gson-2.10.1.jar";           u = "https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar" },
            @{ n = "okhttp-3.14.9.jar";         u = "https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.14.9/okhttp-3.14.9.jar" },
            @{ n = "okio-1.17.5.jar";           u = "https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar" },
            @{ n = "jsoup-1.17.2.jar";          u = "https://repo1.maven.org/maven2/org/jsoup/jsoup/1.17.2/jsoup-1.17.2.jar" },
            @{ n = "json-20180813.jar";         u = "https://repo1.maven.org/maven2/org/json/json/20180813/json-20180813.jar" },
            @{ n = "bcprov-jdk18on-1.78.1.jar"; u = "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar" },
            @{ n = "slf4j-api-2.0.16.jar";      u = "https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar" },
            @{ n = "slf4j-simple-2.0.16.jar";   u = "https://repo1.maven.org/maven2/org/slf4j/slf4j-simple/2.0.16/slf4j-simple-2.0.16.jar" },
            @{ n = "sqlite-jdbc-3.46.1.0.jar";  u = "https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.46.1.0/sqlite-jdbc-3.46.1.0.jar" }
          )
          foreach ($m in $maven) {
            $dest = Join-Path $libs $m.n
            if (Test-Path $dest) { Write-Host "exists: $($m.n)"; continue }
            Write-Host "downloading: $($m.n)"
            $attempts = 0
            while ($attempts -lt 3) {
              $attempts++
              try { Invoke-WebRequest -Uri $m.u -OutFile $dest -UseBasicParsing -TimeoutSec 120; break }
              catch {
                if ($attempts -ge 3) { throw "download failed: $($m.n)" }
                Start-Sleep -Seconds 3
              }
            }
          }

      # ==================================================================
      # 4. Patch stubs-src 缺失类（编译 stubs.jar 需要）
      # ==================================================================
      - name: Patch stubs-src missing classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/jvm/stubs-src/android/content
          mkdir -p resources/jvm/stubs-src/com/github/catvod/net

          cat > resources/jvm/stubs-src/android/content/SharedPreferences.java << 'JAVAEOF'
          package android.content;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          public interface SharedPreferences {
              Map<String, SharedPreferences> Mem = new ConcurrentHashMap<>();
              String getString(String key, String defValue);
              int getInt(String key, int defValue);
              long getLong(String key, long defValue);
              boolean getBoolean(String key, boolean defValue);
              float getFloat(String key, float defValue);
              Editor edit();
              interface Editor {
                  Editor putString(String key, String value);
                  Editor putInt(String key, int value);
                  Editor putLong(String key, long value);
                  Editor putBoolean(String key, boolean value);
                  Editor putFloat(String key, float value);
                  boolean commit();
                  void apply();
              }
          }
          JAVAEOF

          cat > resources/jvm/stubs-src/com/github/catvod/net/OkHttp.java << 'JAVAEOF'
          package com.github.catvod.net;
          import okhttp3.Dns;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.ResponseBody;
          import java.util.Map;
          import java.util.concurrent.TimeUnit;
          public class OkHttp {
              private static OkHttpClient client;
              public static Dns dns() { return Dns.SYSTEM; }
              public static OkHttpClient client() {
                  if (client == null) {
                      client = new OkHttpClient.Builder()
                              .connectTimeout(30, TimeUnit.SECONDS)
                              .readTimeout(30, TimeUnit.SECONDS)
                              .writeTimeout(30, TimeUnit.SECONDS)
                              .build();
                  }
                  return client;
              }
              public static String string(String url) throws Exception { return string(url, null); }
              public static String string(String url, Map<String, String> headers) throws Exception {
                  Request.Builder b = new Request.Builder().url(url);
                  if (headers != null) {
                      for (Map.Entry<String, String> e : headers.entrySet()) b.addHeader(e.getKey(), e.getValue());
                  }
                  try (Response resp = client().newCall(b.build()).execute()) {
                      ResponseBody body = resp.body();
                      return body == null ? "" : body.string();
                  }
              }
          }
          JAVAEOF
          echo "patched stubs-src"

      # ==================================================================
      # 5. 编译 stubs.jar —— resources/jvm/stubs/stubs.jar
      # ==================================================================
      - name: Compile stubs.jar
        shell: pwsh
        run: |
          $stubsSrc = "resources/jvm/stubs-src"
          $stubsDir = "resources/jvm/stubs"
          $classes  = Join-Path $stubsDir "classes"
          New-Item -ItemType Directory -Force -Path $stubsDir | Out-Null
          Remove-Item -Recurse -Force $classes -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $classes | Out-Null

          $androidAll = Join-Path $stubsDir "android-all-base.jar"
          if (-not (Test-Path $androidAll)) {
            Write-Host "Downloading android-all (~130MB)..."
            $url = "https://repo1.maven.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar"
            $attempts = 0
            while ($attempts -lt 3) {
              $attempts++
              try { Invoke-WebRequest -Uri $url -OutFile $androidAll -UseBasicParsing -TimeoutSec 900; break }
              catch {
                if ($attempts -ge 3) { throw "android-all download failed" }
                Start-Sleep -Seconds 5
              }
            }
          }

          $libs = Get-ChildItem "resources/jvm/libs" -Filter "*.jar" | ForEach-Object { $_.FullName }
          $cp = ($libs + $androidAll) -join ";"

          $files = Get-ChildItem -Path $stubsSrc -Recurse -Filter "*.java" | ForEach-Object { $_.FullName }
          Write-Host "Compiling $($files.Count) .java files..."
          javac -encoding UTF-8 -cp $cp -d $classes $files
          if ($LASTEXITCODE -ne 0) { throw "javac failed" }

          $stubsJar = Join-Path $stubsDir "stubs.jar"
          Copy-Item $androidAll $stubsJar -Force
          Push-Location $classes
          & jar uf "../stubs.jar" .
          Pop-Location
          Write-Host "stubs.jar: $((Get-Item $stubsJar).Length) B"

          # android-all-base.jar 只是编译时的辅助，绝不进安装包
          Remove-Item -Force $androidAll -ErrorAction SilentlyContinue
          Write-Host "removed android-all-base.jar (kept out of package)"

      # ==================================================================
      # 6. 校验 —— 严格对齐代码期望的路径
      # ==================================================================
      - name: Verify resources (match code paths)
        shell: pwsh
        run: |
          $must = @(
            # JarSpiderBridge.javaExePath()
            "resources/jvm/jre/bin/java.exe",
            # JarSpiderBridge.runDex2jar 的 -cp（★ 关键）
            "resources/jvm/d2j/dex-tools-v2.4.jar",
            # JarSpiderBridge.classpathJars()
            "resources/jvm/stubs/stubs.jar",
            # libs（运行时 -cp 由 libJars() 读）
            "resources/jvm/libs/gson-2.10.1.jar",
            "resources/jvm/libs/okhttp-3.14.9.jar",
            "resources/jvm/libs/okio-1.17.5.jar",
            "resources/jvm/libs/jsoup-1.17.2.jar",
            "resources/jvm/libs/sqlite-jdbc-3.46.1.0.jar"
          )
          foreach ($m in $must) {
            if (-not (Test-Path $m)) { throw "missing: $m" }
            $sz = (Get-Item $m).Length
            Write-Host "OK: $m ($sz B)"
          }

          # 独立验证：用安装目录里会有的东西，跑一次 dex2jar
          Write-Host "`n=== 独立验证 dex2jar 能否起来 ==="
          $jre = "resources/jvm/jre/bin/java.exe"
          $d2j = "resources/jvm/d2j"
          & $jre -cp "$d2j\*" com.googlecode.dex2jar.tools.Dex2jarCmd --version
          if ($LASTEXITCODE -ne 0) { throw "dex2jar 独立验证失败：java -cp 'd2j/*' Dex2jarCmd 无法启动" }
          Write-Host "dex2jar verification OK"

      # ==================================================================
      # 7. 测试 & 构建
      # ==================================================================
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Create placeholder LICENSE.txt
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      # ==================================================================
      # 8. 发布到 GitHub Release
      # ==================================================================
      - name: Get package version
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $pkg.version
          $tag = "v$v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: |
            release${{ steps.pkg.outputs.version }}/*.exe
            release${{ steps.pkg.outputs.version }}/*.blockmap
            release${{ steps.pkg.outputs.version }}/latest.yml

      - name: Upload to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Win-Box ${{ steps.pkg.outputs.tag }}
          body: |
            ## Win-Box ${{ steps.pkg.outputs.version }}

            自动构建于 ${{ github.sha }}

            ### 下载
            - `Win-Box Setup ${{ steps.pkg.outputs.version }}.exe` —— Windows 安装包
            - `latest.yml` / `*.blockmap` —— 自动更新清单
          files: |
            release${{ steps.pkg.outputs.version }}/*.exe
            release${{ steps.pkg.outputs.version }}/*.blockmap
            release${{ steps.pkg.outputs.version }}/latest.yml
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
