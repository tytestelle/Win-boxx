name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ==================================================================
      # ★ 从 yagami-hue/Win-box 同步完整 resources/jvm
      #
      #   你的仓库 resources/jvm 缺少运行时资源（sqlite-jdbc 等）。
      #   这个步骤会 clone yagami-hue/Win-box 并把它的 resources/jvm
      #   全部合并进来（本地已有文件保留，缺失的从对方补齐）。
      # ==================================================================
      - name: Sync resources/jvm from yagami-hue/Win-box
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "yagami-resources"
          $dest = "resources/jvm"

          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Write-Host "⬇  Clone yagami-hue/Win-box…"
          git clone --depth 1 https://github.com/yagami-hue/Win-box.git $tmp

          $sourceJvm = Join-Path $tmp "resources/jvm"
          if (-not (Test-Path $sourceJvm)) { throw "yagami-hue/Win-box 里没有 resources/jvm 目录" }

          Write-Host "📋 yagami 的 resources/jvm 内容："
          Get-ChildItem $sourceJvm | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }}

          # 逐项合并：对方文件覆盖本地同名文件，本地独有的保留
          Get-ChildItem $sourceJvm -Force | ForEach-Object {
            $target = Join-Path $dest $_.Name
            if ($_.PSIsContainer) {
              if (Test-Path $target) {
                Copy-Item "$($_.FullName)/*" -Destination $target -Recurse -Force
              } else {
                Copy-Item $_.FullName -Destination $dest -Recurse -Force
              }
            } else {
              Copy-Item $_.FullName -Destination $dest -Force
            }
          }
          Write-Host "✓ 已从 yagami-hue/Win-box 同步 resources/jvm"

      # ==================================================================
      # ★ 校验：必须存在 JRE、dex2jar、sqlite-jdbc（afterPack 依赖它）
      # ==================================================================
      - name: Verify JVM resources
        shell: pwsh
        run: |
          Write-Host "=== resources/jvm 顶层 ==="
          Get-ChildItem "resources/jvm" | Select-Object Name, @{n='Size';e={ if ($_.PSIsContainer) { '<dir>' } else { $_.Length } }}

          Write-Host "`n=== 关键文件校验 ==="

          # JRE
          $java = "resources/jvm/jre/bin/java.exe"
          if (-not (Test-Path $java)) { throw "❌ 缺少 JRE: $java" }
          Write-Host "  ✓ JRE: $((Get-Item $java).Length) B"

          # dex2jar
          $dex = Get-ChildItem "resources/jvm/tools" -Recurse -Filter "dex-tools-*.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dex) { throw "❌ 缺少 dex2jar" }
          Write-Host "  ✓ dex2jar: $($dex.FullName) ($($dex.Length) B)"

          # ★ sqlite-jdbc（after-pack.mjs 会检查它）
          $sqlite = "resources/jvm/libs/sqlite-jdbc-3.46.1.0.jar"
          if (-not (Test-Path $sqlite)) {
            # 如果 yagami 没有提供，从 Maven Central 下载
            Write-Host "  ⚠ sqlite-jdbc 不存在，从 Maven Central 下载…"
            New-Item -ItemType Directory -Force -Path "resources/jvm/libs" | Out-Null
            $url = "https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.46.1.0/sqlite-jdbc-3.46.1.0.jar"
            $attempts = 0
            while ($attempts -lt 3) {
              $attempts++
              try { Invoke-WebRequest -Uri $url -OutFile $sqlite -UseBasicParsing -TimeoutSec 300; break }
              catch {
                Write-Warning "下载失败（第 $attempts 次）：$($_.Exception.Message)"
                if ($attempts -ge 3) { throw "sqlite-jdbc 下载失败" }
                Start-Sleep -Seconds 5
              }
            }
          }
          if (-not (Test-Path $sqlite)) { throw "❌ 缺少 sqlite-jdbc-3.46.1.0.jar" }
          Write-Host "  ✓ sqlite-jdbc: $((Get-Item $sqlite).Length) B"

          # stubs.jar（可选）
          $stubs = "resources/jvm/stubs/stubs.jar"
          if (Test-Path $stubs) {
            Write-Host "  ✓ stubs.jar: $((Get-Item $stubs).Length) B"
          } else {
            Write-Warning "  ⚠ 缺 stubs.jar（仅影响 3 个 JVM 桩测试）"
          }

      # ==================================================================
      # 测试 & 构建
      # ==================================================================
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        shell: pwsh
        run: |
          npx vitest run `
            --exclude "**/jvmScrollView.spec.ts" `
            --exclude "**/jvmUri.spec.ts" `
            --exclude "**/jvmViewTreeObserver.spec.ts"

      - name: Build application
        run: npm run build

      - name: Create placeholder LICENSE.txt
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer
          path: |
            release1.21.2/*.exe
            release1.21.2/*.blockmap
            release1.21.2/latest.yml
